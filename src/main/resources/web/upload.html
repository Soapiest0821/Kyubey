<!DOCTYPE html>
<!--
  폰에서 열리는 "파일 올리기" 화면. 위젯이 {{TOKEN}} 만 갈아끼워서 내려준다 (Pages.upload).
  고른 파일을 하나씩 PUT 으로 올린다 — multipart 로 보내면 서버에서 경계선을 직접
  파싱해야 하는데, 몸통에 파일만 그대로 실어 보내면 받는 쪽은 그냥 복사하면 된다.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>컴퓨터로 보내기</title>
<style>
  :root {
    --ink: #4a2c3a;
    --dim: #8a6475;
    --hot: #ff69a0;
    --line: rgba(255, 105, 160, .35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100dvh;
    padding: 28px 18px calc(28px + env(safe-area-inset-bottom));
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    color: var(--ink);
    background: linear-gradient(170deg, #ffe3f1 0%, #ffd0e6 55%, #ffc2de 100%);
  }
  h1 { margin: 0 0 4px; font-size: 21px; }
  .sub { margin: 0 0 22px; font-size: 13px; color: var(--dim); }

  /* 파일 고르는 칸 — label 을 크게 키워서 화면 어디를 눌러도 잡히게 */
  .drop {
    display: block;
    padding: 34px 16px;
    text-align: center;
    border: 2px dashed var(--line);
    border-radius: 18px;
    background: rgba(255, 255, 255, .55);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .drop:active, .drop.over { background: rgba(255, 255, 255, .85); border-color: var(--hot); }
  .drop .big { display: block; font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .drop .small { font-size: 12px; color: var(--dim); }
  input[type=file] { display: none; }

  ul { list-style: none; margin: 20px 0 0; padding: 0; }
  li {
    padding: 12px 14px;
    margin-bottom: 10px;
    border-radius: 14px;
    background: rgba(255, 255, 255, .7);
  }
  .row { display: flex; gap: 10px; align-items: baseline; }
  .name { flex: 1; font-size: 14px; word-break: break-all; }
  .state { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .track { height: 5px; margin-top: 9px; border-radius: 99px; background: rgba(255, 105, 160, .2); overflow: hidden; }
  .bar { height: 100%; width: 0; border-radius: 99px; background: var(--hot); transition: width .12s linear; }
  li.done .bar { background: #4fbf8b; }
  li.done .state { color: #2f8f63; }
  li.fail .bar { background: #d9534f; width: 100% !important; }
  li.fail .state { color: #c0392b; }
</style>
</head>
<body>
  <h1>📥 컴퓨터로 보내기</h1>
  <p class="sub">고른 파일이 컴퓨터 다운로드 폴더에 저장돼.</p>

  <label class="drop" id="drop">
    <span class="big">파일 고르기</span>
    <span class="small">여러 개 한꺼번에 골라도 돼</span>
    <input type="file" id="pick" multiple>
  </label>

  <ul id="list"></ul>

<script>
  var UP = '/{{TOKEN}}/up';
  var list = document.getElementById('list');
  var drop = document.getElementById('drop');
  var queue = [];
  var busy = false;

  document.getElementById('pick').addEventListener('change', function (e) {
    add(e.target.files);
    // 같은 파일을 다시 고를 수도 있으니 비워둔다 (안 그러면 change 가 안 뜬다)
    e.target.value = '';
  });

  // 폰에선 거의 안 쓰지만, 컴퓨터 브라우저로 열었을 때 끌어다 놓을 수 있게
  ['dragenter', 'dragover'].forEach(function (type) {
    drop.addEventListener(type, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (type) {
    drop.addEventListener(type, function () { drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) { e.preventDefault(); add(e.dataTransfer.files); });

  function add(files) {
    for (var i = 0; i < files.length; i++) queue.push(row(files[i]));
    next();
  }

  /** 목록에 줄 하나 만들어 붙이고, 올릴 때 쓸 손잡이를 돌려준다 */
  function row(file) {
    var li = document.createElement('li');
    li.innerHTML = '<div class="row"><span class="name"></span><span class="state">대기 중</span></div>'
      + '<div class="track"><div class="bar"></div></div>';
    li.querySelector('.name').textContent = file.name;
    list.appendChild(li);
    return {
      file: file,
      li: li,
      bar: li.querySelector('.bar'),
      state: li.querySelector('.state')
    };
  }

  /** 한 번에 하나씩만 올린다 — 여러 개를 동시에 밀어넣으면 와이파이에서 서로 느려진다 */
  function next() {
    if (busy || !queue.length) return;
    busy = true;
    upload(queue.shift(), function () { busy = false; next(); });
  }

  function upload(item, done) {
    var xhr = new XMLHttpRequest();
    xhr.open('PUT', UP + '?n=' + encodeURIComponent(item.file.name));

    xhr.upload.onprogress = function (e) {
      if (!e.lengthComputable) return;
      var pct = Math.round(e.loaded / e.total * 100);
      item.bar.style.width = pct + '%';
      item.state.textContent = pct + '%';
    };
    xhr.onload = function () {
      if (xhr.status === 200) {
        item.li.classList.add('done');
        item.bar.style.width = '100%';
        // 컴퓨터에 이미 같은 이름이 있으면 번호가 붙는다. 어떤 이름으로 앉았는지 알려준다.
        var saved = (xhr.responseText || '').trim();
        item.state.textContent = saved && saved !== item.file.name ? '저장됨 · ' + saved : '저장됨';
      } else {
        fail(item, '실패 (' + xhr.status + ')');
      }
      done();
    };
    xhr.onerror = function () { fail(item, '연결 끊김'); done(); };
    xhr.onabort = function () { fail(item, '취소됨'); done(); };

    item.state.textContent = '0%';
    xhr.send(item.file);
  }

  function fail(item, message) {
    item.li.classList.add('fail');
    item.state.textContent = message;
  }
</script>
</body>
</html>
