<!DOCTYPE html>
<!--
  컴퓨터에서 여러 개를 내걸었을 때 폰에 뜨는 목록. 하나만 내걸었을 땐 이 화면을 안 거치고
  주소가 곧 그 파일이라 QR 을 찍는 순간 바로 내려받기가 시작된다 (LanShare.send).
  빈칸은 Pages.fileList 가 채운다.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>컴퓨터에서 온 파일</title>
<style>
  :root {
    --ink: #4a2c3a;
    --dim: #8a6475;
    --hot: #ff69a0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100dvh;
    padding: 28px 18px calc(28px + env(safe-area-inset-bottom));
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    color: var(--ink);
    background: linear-gradient(170deg, #ffe3f1 0%, #ffd0e6 55%, #ffc2de 100%);
  }
  h1 { margin: 0 0 4px; font-size: 21px; }
  .sub { margin: 0 0 22px; font-size: 13px; color: var(--dim); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { margin-bottom: 10px; }
  a {
    display: flex;
    gap: 12px;
    align-items: baseline;
    padding: 14px 16px;
    border-radius: 14px;
    background: rgba(255, 255, 255, .7);
    color: inherit;
    text-decoration: none;
  }
  a:active { background: #fff; }
  .name { flex: 1; font-size: 15px; word-break: break-all; }
  .size { font-size: 12px; color: var(--dim); white-space: nowrap; }
</style>
</head>
<body>
  <h1>📤 컴퓨터에서 온 파일</h1>
  <p class="sub">{{COUNT}}개 — 눌러서 받아.</p>
  <ul>
{{ROWS}}
  </ul>
</body>
</html>
